name: Desktop app

# สร้างแอปเดสก์ท็อป WebMix Pro (Tauri / Rust) สำหรับ Windows, macOS และ Linux
# แล้วเปิดแอปจริงในโหมดทดสอบตัวเอง (WEBMIX_SELFTEST) บนทุกระบบ — ตัวติดตั้งอยู่ใน Artifacts ของแต่ละรอบ
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gateway:
    name: Rust gateway (unit + end-to-end)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - name: Install ffmpeg (with SRT)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Unit tests
        working-directory: desktop
        run: cargo test -p webmix-gateway
      - name: Clippy
        working-directory: desktop
        run: cargo clippy -p webmix-gateway -- -D warnings
      - name: Build gateway
        working-directory: desktop
        run: cargo build --release -p webmix-gateway
      - name: Install test dependencies
        run: |
          (cd server && npm ci)
          cd tests && npm ci && npx playwright install --with-deps chromium
      - name: Web suites against the Rust gateway
        working-directory: tests
        env:
          GATEWAY_BIN: desktop/target/release/webmix-gateway
        run: npm test -- multistream srt-output reconnect desktop

  app:
    name: App · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            exe: desktop/target/release/webmix-desktop
          - name: Windows
            os: windows-latest
            exe: desktop/target/release/webmix-desktop.exe
          - name: macOS
            os: macos-latest
            exe: desktop/target/release/webmix-desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            xvfb ffmpeg gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - name: Build installers
        working-directory: desktop
        shell: bash
        run: npx --yes @tauri-apps/cli@2 build
      - name: Self-test (open the real app)
        shell: bash
        env:
          WEBMIX_SELFTEST: '1'
          WEBMIX_SELFTEST_OUT: ${{ runner.temp }}/selftest.json
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "${{ matrix.exe }}" & else "${{ matrix.exe }}" & fi
          for i in $(seq 1 120); do [ -s "$WEBMIX_SELFTEST_OUT" ] && break; sleep 1; done
          sleep 2
          test -s "$WEBMIX_SELFTEST_OUT" || { echo "แอปไม่ส่งผลทดสอบภายใน 120 วินาที"; exit 1; }
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            console.log(r.ua || "");
            for (const c of r.checks || []) console.log(`${c.ok ? "✓" : c.required ? "✗" : "·"} ${c.name.padEnd(16)} ${c.detail}`);
            if (r.error) console.log("error:", r.error);
            process.exit(r.ok ? 0 : 1);
          ' "$WEBMIX_SELFTEST_OUT"
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: WebMix-Pro-${{ matrix.name }}
          path: |
            desktop/target/release/bundle/**/*.msi
            desktop/target/release/bundle/**/*.exe
            desktop/target/release/bundle/**/*.dmg
            desktop/target/release/bundle/**/*.deb
            desktop/target/release/bundle/**/*.rpm
            desktop/target/release/bundle/**/*.AppImage
          if-no-files-found: error
          retention-days: 30

  # ติด tag เวอร์ชัน (เช่น v1.0.0) → สร้าง GitHub Release พร้อมตัวติดตั้งทุกระบบ ให้ดาวน์โหลดได้โดยไม่ต้องล็อกอินและไม่หมดอายุ
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gateway, app]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the app version
        run: |
          APP_VERSION=$(node -p 'require("./desktop/src-tauri/tauri.conf.json").version')
          test "v$APP_VERSION" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME ไม่ตรงกับเวอร์ชันแอป $APP_VERSION (desktop/src-tauri/tauri.conf.json)"; exit 1; }
      - name: Collect installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'WebMix-Pro-*' --dir artifacts
          mkdir release
          find artifacts -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -print0 |
            while IFS= read -r -d '' f; do cp "$f" "release/$(basename "$f" | tr ' ' '-')"; done
          ls -la release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## ดาวน์โหลด

          | ระบบ | ไฟล์ |
          |---|---|
          | Windows 10/11 | `.msi` หรือ `-setup.exe` |
          | macOS 11+ (Apple Silicon) | `.dmg` — ครั้งแรกให้คลิกขวาที่แอป → Open (แอปยังไม่ได้ลงนาม) |
          | Ubuntu / Debian | `.deb` (ติดตั้ง ffmpeg และ GStreamer ให้อัตโนมัติ) |
          | Fedora / openSUSE | `.rpm` |
          | Linux อื่น ๆ | `.AppImage` |

          การสตรีมต้องมี ffmpeg — Windows: `winget install ffmpeg` · macOS: `brew install ffmpeg` (การบันทึกไม่ต้องใช้)
          รายละเอียดและข้อจำกัด: ดู README หัวข้อ “แอปเดสก์ท็อป”
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "WebMix Pro $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
