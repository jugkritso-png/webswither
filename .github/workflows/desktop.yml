name: Desktop app

# สร้างแอปเดสก์ท็อป WebMix Pro (Tauri / Rust) สำหรับ Windows, macOS และ Linux
# แล้วเปิดแอปจริงในโหมดทดสอบตัวเอง (WEBMIX_SELFTEST) บนทุกระบบ — ตัวติดตั้งอยู่ใน Artifacts ของแต่ละรอบ
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'สร้าง GitHub Release (tag v<เวอร์ชันใน tauri.conf.json>) จาก commit นี้'
        type: boolean
        default: false

# รอบออก release (workflow_dispatch) แยกกลุ่มจากรอบ push — push ใหม่ระหว่าง build จะได้ไม่ยกเลิก release
concurrency:
  group: desktop-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'release' || 'push' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gateway:
    name: Rust gateway (unit + end-to-end)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - name: Install ffmpeg (with SRT)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Unit tests
        working-directory: desktop
        run: cargo test -p webmix-gateway
      - name: Clippy
        working-directory: desktop
        run: cargo clippy -p webmix-gateway -- -D warnings
      - name: Build gateway
        working-directory: desktop
        run: cargo build --release -p webmix-gateway
      - name: Install test dependencies
        run: |
          (cd server && npm ci)
          cd tests && npm ci && npx playwright install --with-deps chromium
      - name: Web suites against the Rust gateway
        working-directory: tests
        env:
          GATEWAY_BIN: desktop/target/release/webmix-gateway
        run: npm test -- multistream srt-output reconnect desktop vertical abr srt-input netinputs recovery netvideo
      - name: NDI / OMT self-test (mock library)
        working-directory: tests
        run: |
          for p in ndi omt; do WEBMIX_NDI_LIB=$PWD/.work/libnetvideo-mock.so WEBMIX_OMT_LIB=$PWD/.work/libnetvideo-mock.so ../desktop/target/release/webmix-gateway --netvideo-selftest $p; done

  app:
    name: App · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            exe: desktop/target/release/webmix-desktop
            # Linux: สตรีมจริงไปเครื่องรับ RTMP บนเครื่อง CI ด้วย (ตรวจเส้นทาง WebCodecs + WebM ของ WebKitGTK)
            stream: rtmp://127.0.0.1:1935/live/selftest
          - name: Windows
            os: windows-latest
            exe: desktop/target/release/webmix-desktop.exe
          - name: macOS
            os: macos-latest
            # ไฟล์เดียวใช้ได้ทั้ง Mac ชิป Apple และ Intel
            target: universal-apple-darwin
            exe: desktop/target/universal-apple-darwin/release/webmix-desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          if [ "${{ matrix.target }}" = universal-apple-darwin ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            xvfb ffmpeg gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      # OMT (Open Media Transport, MIT): ใช้ไลบรารีจาก release ทางการของ openmediatransport/libomtnet แนบไปกับแอป
      # ไม่พบ/ดาวน์โหลดไม่ได้ → สร้างแอปต่อได้ (OMT ใช้ไม่ได้ในรอบนั้น)
      - name: OMT libraries (libomt + libvmx)
        if: runner.os != 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          D="$RUNNER_TEMP/omt"; mkdir -p "$D" desktop/src-tauri/omt
          gh release download --repo openmediatransport/libomtnet --dir "$D" --pattern '*' || { echo "::warning::ดาวน์โหลด OMT ไม่ได้ — แอปรอบนี้จะไม่มี OMT"; exit 0; }
          (cd "$D" && for z in *.zip; do [ -f "$z" ] && unzip -o -q "$z" -d "x_${z%.zip}"; done; for t in *.tar.gz *.tgz; do [ -f "$t" ] && mkdir -p "x_$t" && tar xzf "$t" -C "x_$t"; done)
          if [ "$RUNNER_OS" = Windows ]; then EXT=dll; PREF='x64|amd64|win-x64'; else EXT=dylib; PREF='universal|osx|mac'; fi
          pick() { find "$D" -type f -iname "$1.$EXT" | awk -v p="$PREF" '{ l = tolower($0); s = (l ~ p) ? 0 : 1; if (l ~ /arm64/ && p !~ /universal/) s = 2; print s "\t" $0 }' | sort | head -1 | cut -f2; }
          OMT=$(pick libomt); VMX=$(pick libvmx)
          echo "libomt: $OMT"; echo "libvmx: $VMX"
          if [ -n "$OMT" ] && [ -n "$VMX" ]; then
            cp "$OMT" "$VMX" desktop/src-tauri/omt/ && cp desktop/omt-LICENSE.txt desktop/src-tauri/omt/LICENSE-OMT.txt
            [ "$RUNNER_OS" = macOS ] && for f in desktop/src-tauri/omt/*.dylib; do lipo -info "$f"; codesign --force -s - "$f"; done
            echo "OMT_BUNDLED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::ไม่พบ libomt/libvmx ใน release — แอปรอบนี้จะไม่มี OMT"; find "$D" -type f | head -40
          fi
      - name: Build installers
        working-directory: desktop
        shell: bash
        # มีกุญแจเซ็นอัปเดตใน Secrets → สร้างไฟล์อัปเดตพร้อมลายเซ็น (.sig) ให้แอปที่ติดตั้งแล้วอัปเดตตัวเองได้
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          EXTRA=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then EXTRA=(--config '{"bundle":{"createUpdaterArtifacts":true}}'); else echo "::notice::ไม่มี TAURI_SIGNING_PRIVATE_KEY — ข้ามไฟล์อัปเดตอัตโนมัติ"; fi
          # ไลบรารี OMT ไปอยู่ในโฟลเดอร์ omt/ ข้างโปรแกรม (Windows) หรือใน Contents/Resources/omt (macOS)
          if [ "$OMT_BUNDLED" = 1 ]; then EXTRA+=(--config '{"bundle":{"resources":{"omt/":"omt/"}}}'); fi
          npx --yes @tauri-apps/cli@2 build ${{ matrix.target && format('--target {0}', matrix.target) || '' }} "${EXTRA[@]}"
      - name: Self-test (open the real app)
        shell: bash
        env:
          WEBMIX_SELFTEST: ${{ matrix.stream || '1' }}
          WEBMIX_SELFTEST_OUT: ${{ runner.temp }}/selftest.json
        run: |
          if [ -n "${{ matrix.stream }}" ]; then
            ffmpeg -hide_banner -loglevel error -listen 1 -i "${{ matrix.stream }}" -c copy -y "$RUNNER_TEMP/selftest.flv" &
            sleep 1
          fi
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "${{ matrix.exe }}" & else "${{ matrix.exe }}" & fi
          for i in $(seq 1 120); do [ -s "$WEBMIX_SELFTEST_OUT" ] && break; sleep 1; done
          sleep 2
          test -s "$WEBMIX_SELFTEST_OUT" || { echo "แอปไม่ส่งผลทดสอบภายใน 120 วินาที"; exit 1; }
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            console.log(r.ua || "");
            for (const c of r.checks || []) console.log(`${c.ok ? "✓" : c.required ? "✗" : "·"} ${c.name.padEnd(16)} ${c.detail}`);
            if (r.error) console.log("error:", r.error);
            // แนบ OMT มาแล้ว → แอปที่สร้างเสร็จต้องโหลดได้จริง
            const omt = (r.checks || []).find(c => c.name === "omt");
            if (process.env.OMT_BUNDLED === "1" && !(omt && omt.ok)) { console.log("OMT ที่แนบมากับแอปโหลดไม่ได้"); process.exit(1); }
            process.exit(r.ok ? 0 : 1);
          ' "$WEBMIX_SELFTEST_OUT"
          if [ -n "${{ matrix.stream }}" ]; then
            sleep 3
            PROBE=$(ffprobe -v error -show_entries stream=codec_name,width -of compact=p=0 "$RUNNER_TEMP/selftest.flv" || true)
            echo "RTMP ที่ได้รับ: $PROBE"
            echo "$PROBE" | grep -q 'codec_name=h264|width=1280' && echo "$PROBE" | grep -q 'codec_name=aac' || { echo "ไม่ได้สตรีม H.264 + AAC"; exit 1; }
            # ส่วนท้ายไฟล์อาจขาดตอนเครื่องรับหยุด จึงนับเฟรมที่ถอดรหัสได้แทนการห้ามมี error
            FRAMES=$(ffprobe -v error -count_frames -select_streams v -show_entries stream=nb_read_frames -of csv=p=0 "$RUNNER_TEMP/selftest.flv")
            echo "ถอดรหัสได้ $FRAMES เฟรม"
            [ "${FRAMES:-0}" -ge 150 ] || { echo "สตรีมที่ได้สั้นหรือถอดรหัสไม่ได้"; exit 1; }
          fi
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: WebMix-Pro-${{ matrix.name }}
          path: |
            desktop/target/release/bundle/**/*.msi
            desktop/target/release/bundle/**/*.exe
            desktop/target/**/release/bundle/**/*.dmg
            desktop/target/release/bundle/**/*.deb
            desktop/target/release/bundle/**/*.rpm
            desktop/target/release/bundle/**/*.AppImage
            desktop/target/**/release/bundle/**/*.app.tar.gz
            desktop/target/**/release/bundle/**/*.sig
          if-no-files-found: error
          retention-days: 30

  # แอป Android: ffmpeg ที่คอมไพล์เอง (ฝังในแอป) + Gateway ในตัว → ทดสอบบน emulator ว่าสตรีม RTMP ออกมาได้จริง
  android:
    name: App · Android
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --target aarch64-linux-android,x86_64-linux-android && rustup default stable
      - name: Android NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK_VERSION=$(basename "$ANDROID_NDK_LATEST_HOME")" >> "$GITHUB_ENV"
      - name: Build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nasm ffmpeg
      - name: Cache ffmpeg for Android
        id: ffcache
        uses: actions/cache@v4
        with:
          path: desktop/android/ffmpeg-out
          key: android-ffmpeg-${{ hashFiles('desktop/android/build-ffmpeg.sh') }}-${{ env.NDK_VERSION }}
      - name: Build ffmpeg for Android (x264 + OpenSSL + srt + MediaCodec)
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: |
          WORK=$RUNNER_TEMP/ffbuild desktop/android/build-ffmpeg.sh arm64-v8a desktop/android/ffmpeg-out/arm64-v8a
          WORK=$RUNNER_TEMP/ffbuild desktop/android/build-ffmpeg.sh x86_64 desktop/android/ffmpeg-out/x86_64
      # Gradle เรียก `npm run tauri ...` กลับมาระหว่าง build จึงต้องติดตั้ง CLI ตาม desktop/package.json
      - name: Android project
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm run tauri -- android init --ci
          npm run tauri -- icon src-tauri/icons/icon.png
          android/prepare.sh android/ffmpeg-out
      - name: Build APK
        working-directory: desktop
        run: npm run tauri -- android build --apk --split-per-abi --target aarch64 --target x86_64
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: desktop/android/sign.sh dist-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Self-test on emulator (streams RTMP through the in-app gateway)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash desktop/android/emulator-test.sh dist-android/WebMix-Pro_*_android-x86_64.apk test-output/android desktop/android/ffmpeg-out/x86_64/ffmpeg
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: WebMix-Pro-Android
          path: dist-android/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-output
          path: test-output/
          if-no-files-found: ignore
          retention-days: 7

  # ติด tag เวอร์ชัน (เช่น v1.0.0) หรือกด Run workflow แล้วติ๊ก release → สร้าง GitHub Release พร้อมตัวติดตั้งทุกระบบ ให้ดาวน์โหลดได้โดยไม่ต้องล็อกอินและไม่หมดอายุ
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    needs: [gateway, app, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Release tag
        run: |
          APP_VERSION=$(node -p 'require("./desktop/src-tauri/tauri.conf.json").version')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$APP_VERSION" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME ไม่ตรงกับเวอร์ชันแอป $APP_VERSION (desktop/src-tauri/tauri.conf.json)"; exit 1; }
          fi
          echo "TAG=v$APP_VERSION" >> "$GITHUB_ENV"
      - name: Collect installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'WebMix-Pro-*' --dir artifacts
          mkdir release
          find artifacts -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.apk' -o -name '*.app.tar.gz' -o -name '*.sig' \) -print0 |
            while IFS= read -r -d '' f; do cp "$f" "release/$(basename "$f" | tr ' ' '-')"; done
          ls -la release
      # latest.json: แอปที่ติดตั้งแล้วอ่านไฟล์นี้จาก releases/latest เพื่อรู้ว่ามีเวอร์ชันใหม่ (ลายเซ็นตรวจด้วย pubkey ใน tauri.conf.json)
      - name: Update manifest (latest.json)
        run: |
          node - <<'JS'
          const fs = require('fs');
          const tag = process.env.TAG, files = fs.readdirSync('release');
          const base = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/`;
          const pick = re => files.find(f => re.test(f) && files.includes(f + '.sig'));
          const entry = f => f && { signature: fs.readFileSync(`release/${f}.sig`, 'utf8').trim(), url: base + encodeURIComponent(f) };
          const mac = entry(pick(/\.app\.tar\.gz$/));
          const platforms = Object.fromEntries(Object.entries({
            'windows-x86_64': entry(pick(/x64-setup\.exe$/)),
            'darwin-x86_64': mac, 'darwin-aarch64': mac,
            'linux-x86_64': entry(pick(/\.AppImage$/))
          }).filter(([, v]) => v));
          if (!Object.keys(platforms).length) { console.log('::warning::ไม่มีไฟล์ .sig — Release นี้ไม่มีอัปเดตอัตโนมัติ (ตั้ง Secret TAURI_SIGNING_PRIVATE_KEY ก่อน)'); process.exit(0); }
          const manifest = { version: tag.replace(/^v/, ''), notes: `WebMix Pro ${tag} — ดูรายละเอียดที่หน้า Release`, pub_date: new Date().toISOString(), platforms };
          fs.writeFileSync('release/latest.json', JSON.stringify(manifest, null, 2));
          console.log(JSON.stringify(manifest, null, 2));
          JS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## ดาวน์โหลด

          | ระบบ | ไฟล์ |
          |---|---|
          | Windows 10/11 | `.msi` หรือ `-setup.exe` |
          | macOS 11+ (ชิป Apple และ Intel) | `.dmg` — ลากแอปไป Applications แล้วครั้งแรกให้คลิกขวาที่แอป → Open · ถ้าขึ้นว่า "เสียหาย" รันใน Terminal: `xattr -cr "/Applications/WebMix Pro.app"` (แอปยังไม่ได้รับรองจาก Apple) |
          | Ubuntu / Debian | `.deb` (ติดตั้ง ffmpeg และ GStreamer ให้อัตโนมัติ) |
          | Fedora / openSUSE | `.rpm` |
          | Linux อื่น ๆ | `.AppImage` |
          | Android 7+ (มือถือ/แท็บเล็ต ARM64) | `_android-arm64.apk` — มี Gateway และ ffmpeg ในตัว สตรีมได้โดยไม่ต้องมีเซิร์ฟเวอร์ |
          | Android x86_64 (Chromebook / emulator) | `_android-x86_64.apk` |

          การสตรีมบนคอมพิวเตอร์ต้องมี ffmpeg — Windows: `winget install ffmpeg` · macOS: `brew install ffmpeg` (การบันทึกไม่ต้องใช้) · Android มี ffmpeg ในแอปแล้ว
          Linux: กล้องมือถือและแขกรับเชิญใช้ไม่ได้ (WebKitGTK ไม่มี WebRTC) — ใช้หน้าเว็บใน Chrome ถ้าต้องการ
          ติดตั้งแล้วครั้งต่อไปไม่ต้องดาวน์โหลดเอง: แอปบน Windows / macOS / Linux (AppImage) แจ้งและอัปเดตตัวเองได้ · Android แจ้งเมื่อมีเวอร์ชันใหม่
          รายละเอียดและข้อจำกัด: ดู README หัวข้อ “แอปเดสก์ท็อป”
          NOTES
          sed -i 's/^          //' notes.md
          # กดรันเอง: สร้าง tag ให้ที่ commit นี้ (ถ้ามี Release เวอร์ชันนี้แล้วจะหยุด — ให้เพิ่มเลขเวอร์ชันก่อน)
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "WebMix Pro $TAG" --notes-file notes.md --target "$GITHUB_SHA"
