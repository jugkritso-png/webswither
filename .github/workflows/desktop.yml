name: Desktop app

# สร้างแอปเดสก์ท็อป WebMix Pro (Tauri / Rust) สำหรับ Windows, macOS และ Linux
# แล้วเปิดแอปจริงในโหมดทดสอบตัวเอง (WEBMIX_SELFTEST) บนทุกระบบ — ตัวติดตั้งอยู่ใน Artifacts ของแต่ละรอบ
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'สร้าง GitHub Release (tag v<เวอร์ชันใน tauri.conf.json>) จาก commit นี้'
        type: boolean
        default: false

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gateway:
    name: Rust gateway (unit + end-to-end)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - name: Install ffmpeg (with SRT)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Unit tests
        working-directory: desktop
        run: cargo test -p webmix-gateway
      - name: Clippy
        working-directory: desktop
        run: cargo clippy -p webmix-gateway -- -D warnings
      - name: Build gateway
        working-directory: desktop
        run: cargo build --release -p webmix-gateway
      - name: Install test dependencies
        run: |
          (cd server && npm ci)
          cd tests && npm ci && npx playwright install --with-deps chromium
      - name: Web suites against the Rust gateway
        working-directory: tests
        env:
          GATEWAY_BIN: desktop/target/release/webmix-gateway
        run: npm test -- multistream srt-output reconnect desktop vertical

  app:
    name: App · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            exe: desktop/target/release/webmix-desktop
            # Linux: สตรีมจริงไปเครื่องรับ RTMP บนเครื่อง CI ด้วย (ตรวจเส้นทาง WebCodecs + WebM ของ WebKitGTK)
            stream: rtmp://127.0.0.1:1935/live/selftest
          - name: Windows
            os: windows-latest
            exe: desktop/target/release/webmix-desktop.exe
          - name: macOS
            os: macos-latest
            # ไฟล์เดียวใช้ได้ทั้ง Mac ชิป Apple และ Intel
            target: universal-apple-darwin
            exe: desktop/target/universal-apple-darwin/release/webmix-desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          if [ "${{ matrix.target }}" = universal-apple-darwin ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            xvfb ffmpeg gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - name: Build installers
        working-directory: desktop
        shell: bash
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Self-test (open the real app)
        shell: bash
        env:
          WEBMIX_SELFTEST: ${{ matrix.stream || '1' }}
          WEBMIX_SELFTEST_OUT: ${{ runner.temp }}/selftest.json
        run: |
          if [ -n "${{ matrix.stream }}" ]; then
            ffmpeg -hide_banner -loglevel error -listen 1 -i "${{ matrix.stream }}" -c copy -y "$RUNNER_TEMP/selftest.flv" &
            sleep 1
          fi
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "${{ matrix.exe }}" & else "${{ matrix.exe }}" & fi
          for i in $(seq 1 120); do [ -s "$WEBMIX_SELFTEST_OUT" ] && break; sleep 1; done
          sleep 2
          test -s "$WEBMIX_SELFTEST_OUT" || { echo "แอปไม่ส่งผลทดสอบภายใน 120 วินาที"; exit 1; }
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            console.log(r.ua || "");
            for (const c of r.checks || []) console.log(`${c.ok ? "✓" : c.required ? "✗" : "·"} ${c.name.padEnd(16)} ${c.detail}`);
            if (r.error) console.log("error:", r.error);
            process.exit(r.ok ? 0 : 1);
          ' "$WEBMIX_SELFTEST_OUT"
          if [ -n "${{ matrix.stream }}" ]; then
            sleep 3
            PROBE=$(ffprobe -v error -show_entries stream=codec_name,width -of compact=p=0 "$RUNNER_TEMP/selftest.flv" || true)
            echo "RTMP ที่ได้รับ: $PROBE"
            echo "$PROBE" | grep -q 'codec_name=h264|width=1280' && echo "$PROBE" | grep -q 'codec_name=aac' || { echo "ไม่ได้สตรีม H.264 + AAC"; exit 1; }
            # ส่วนท้ายไฟล์อาจขาดตอนเครื่องรับหยุด จึงนับเฟรมที่ถอดรหัสได้แทนการห้ามมี error
            FRAMES=$(ffprobe -v error -count_frames -select_streams v -show_entries stream=nb_read_frames -of csv=p=0 "$RUNNER_TEMP/selftest.flv")
            echo "ถอดรหัสได้ $FRAMES เฟรม"
            [ "${FRAMES:-0}" -ge 150 ] || { echo "สตรีมที่ได้สั้นหรือถอดรหัสไม่ได้"; exit 1; }
          fi
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: WebMix-Pro-${{ matrix.name }}
          path: |
            desktop/target/release/bundle/**/*.msi
            desktop/target/release/bundle/**/*.exe
            desktop/target/**/release/bundle/**/*.dmg
            desktop/target/release/bundle/**/*.deb
            desktop/target/release/bundle/**/*.rpm
            desktop/target/release/bundle/**/*.AppImage
          if-no-files-found: error
          retention-days: 30

  # แอป Android: ffmpeg ที่คอมไพล์เอง (ฝังในแอป) + Gateway ในตัว → ทดสอบบน emulator ว่าสตรีม RTMP ออกมาได้จริง
  android:
    name: App · Android
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --target aarch64-linux-android,x86_64-linux-android && rustup default stable
      - name: Android NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK_VERSION=$(basename "$ANDROID_NDK_LATEST_HOME")" >> "$GITHUB_ENV"
      - name: Build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nasm ffmpeg
      - name: Cache ffmpeg for Android
        id: ffcache
        uses: actions/cache@v4
        with:
          path: desktop/android/ffmpeg-out
          key: android-ffmpeg-${{ hashFiles('desktop/android/build-ffmpeg.sh') }}-${{ env.NDK_VERSION }}
      - name: Build ffmpeg for Android (x264 + OpenSSL + srt + MediaCodec)
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: |
          WORK=$RUNNER_TEMP/ffbuild desktop/android/build-ffmpeg.sh arm64-v8a desktop/android/ffmpeg-out/arm64-v8a
          WORK=$RUNNER_TEMP/ffbuild desktop/android/build-ffmpeg.sh x86_64 desktop/android/ffmpeg-out/x86_64
      # Gradle เรียก `npm run tauri ...` กลับมาระหว่าง build จึงต้องติดตั้ง CLI ตาม desktop/package.json
      - name: Android project
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm run tauri -- android init --ci
          npm run tauri -- icon src-tauri/icons/icon.png
          android/prepare.sh android/ffmpeg-out
      - name: Build APK
        working-directory: desktop
        run: npm run tauri -- android build --apk --split-per-abi --target aarch64 --target x86_64
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: desktop/android/sign.sh dist-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Self-test on emulator (streams RTMP through the in-app gateway)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash desktop/android/emulator-test.sh dist-android/WebMix-Pro_*_android-x86_64.apk test-output/android desktop/android/ffmpeg-out/x86_64/ffmpeg
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: WebMix-Pro-Android
          path: dist-android/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-output
          path: test-output/
          if-no-files-found: ignore
          retention-days: 7

  # ติด tag เวอร์ชัน (เช่น v1.0.0) หรือกด Run workflow แล้วติ๊ก release → สร้าง GitHub Release พร้อมตัวติดตั้งทุกระบบ ให้ดาวน์โหลดได้โดยไม่ต้องล็อกอินและไม่หมดอายุ
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    needs: [gateway, app, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Release tag
        run: |
          APP_VERSION=$(node -p 'require("./desktop/src-tauri/tauri.conf.json").version')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "v$APP_VERSION" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME ไม่ตรงกับเวอร์ชันแอป $APP_VERSION (desktop/src-tauri/tauri.conf.json)"; exit 1; }
          fi
          echo "TAG=v$APP_VERSION" >> "$GITHUB_ENV"
      - name: Collect installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'WebMix-Pro-*' --dir artifacts
          mkdir release
          find artifacts -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.apk' \) -print0 |
            while IFS= read -r -d '' f; do cp "$f" "release/$(basename "$f" | tr ' ' '-')"; done
          ls -la release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## ดาวน์โหลด

          | ระบบ | ไฟล์ |
          |---|---|
          | Windows 10/11 | `.msi` หรือ `-setup.exe` |
          | macOS 11+ (ชิป Apple และ Intel) | `.dmg` — ลากแอปไป Applications แล้วครั้งแรกให้คลิกขวาที่แอป → Open · ถ้าขึ้นว่า "เสียหาย" รันใน Terminal: `xattr -cr "/Applications/WebMix Pro.app"` (แอปยังไม่ได้รับรองจาก Apple) |
          | Ubuntu / Debian | `.deb` (ติดตั้ง ffmpeg และ GStreamer ให้อัตโนมัติ) |
          | Fedora / openSUSE | `.rpm` |
          | Linux อื่น ๆ | `.AppImage` |
          | Android 7+ (มือถือ/แท็บเล็ต ARM64) | `_android-arm64.apk` — มี Gateway และ ffmpeg ในตัว สตรีมได้โดยไม่ต้องมีเซิร์ฟเวอร์ |
          | Android x86_64 (Chromebook / emulator) | `_android-x86_64.apk` |

          การสตรีมบนคอมพิวเตอร์ต้องมี ffmpeg — Windows: `winget install ffmpeg` · macOS: `brew install ffmpeg` (การบันทึกไม่ต้องใช้) · Android มี ffmpeg ในแอปแล้ว
          Linux: กล้องมือถือและแขกรับเชิญใช้ไม่ได้ (WebKitGTK ไม่มี WebRTC) — ใช้หน้าเว็บใน Chrome ถ้าต้องการ
          รายละเอียดและข้อจำกัด: ดู README หัวข้อ “แอปเดสก์ท็อป”
          NOTES
          sed -i 's/^          //' notes.md
          # กดรันเอง: สร้าง tag ให้ที่ commit นี้ (ถ้ามี Release เวอร์ชันนี้แล้วจะหยุด — ให้เพิ่มเลขเวอร์ชันก่อน)
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "WebMix Pro $TAG" --notes-file notes.md --target "$GITHUB_SHA"
