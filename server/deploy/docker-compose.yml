# WebMix Stream Gateway + Caddy (HTTPS อัตโนมัติด้วย Let's Encrypt)
# ค่าต่าง ๆ อ่านจากไฟล์ .env ในโฟลเดอร์นี้ (install.sh สร้างให้อัตโนมัติ)

services:
  gateway:
    build: ..
    restart: unless-stopped
    environment:
      STREAM_TOKEN: ${STREAM_TOKEN:?ต้องตั้ง STREAM_TOKEN ในไฟล์ .env}
      MAX_DESTINATIONS: ${MAX_DESTINATIONS:-6}
      VIDEO_ENCODER: ${VIDEO_ENCODER:-libx264}
      X264_PRESET: ${X264_PRESET:-}
      SRT_PORTS: ${SRT_PORTS:-9000-9009}
    expose:
      - "8080"
    ports:
      # รับสัญญาณ SRT จาก OBS / vMix / encoder (UDP)
      - "${SRT_PORTS:-9000-9009}:${SRT_PORTS:-9000-9009}/udp"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?ต้องตั้ง DOMAIN ในไฟล์ .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
