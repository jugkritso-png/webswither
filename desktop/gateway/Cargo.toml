[package]
name = "webmix-gateway"
description = "WebMix Stream Gateway in Rust: receives the studio's WebM over WebSocket, encodes once with FFmpeg and sends to many RTMP/SRT destinations"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "webmix-gateway"
path = "src/main.rs"

[dependencies]
libloading = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time", "signal"] }
tokio-tungstenite = "0.27"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
